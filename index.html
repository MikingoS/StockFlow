<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Iniciar Sesión</title>
    <!-- FontAwesome para los íconos de usuario y cerrojo dentro de los inputs -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <!-- Tarjeta Azul Oscura -->
        <div class="login-card">
            <!-- Logo + Nombre alineados en la esquina izquierda superior -->
            <div class="login-header">
                <img src="Img/logo-stockflow.png" alt="StockFlow Logo" class="login-logo-img">
                <span class="brand-name">StockFlow</span>
            </div>

            <form action="dashboard.html" class="login-form">
                <!-- Input Usuario -->
                <div class="input-group">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" placeholder="Nombre De Usuario" class="form-control" required>
                </div>

                <!-- Input Contraseña -->
                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" placeholder="Contraseña" class="form-control" required>
                </div>
                
                <!-- Olvidaste contraseña -->
                <div class="forgot-container">
                    <a href="#" class="forgot-password">Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón Iniciar Sesión -->
                <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
            </form>
        </div>

        <!-- Enlace de Registro AFUERA de la tarjeta -->
        <p class="register-redirect">
            ¿No tienes una cuenta? <a href="register.html">Regístrate.</a>
        </p>
    </div>

</body>
</html>
